{% extends "base.html" %}

{% block content %}
<form method="POST">

<label for="year">År</label>
<select id="year" name="year" class="form-select" required>
    <option value="" disabled selected>Välj År</option>
    <option value="2026">2026</option>
    <option value="2025">2025</option>
    <option value="2024">2024</option>
    <option value="2023">2023</option>
    <option value="2022">2022</option>
</select>

<label for="month">Månad</label>
<select id="month" name="month" class="form-select" required>
    <option value="" disabled selected>Välj Månad</option>
    <option value="01">Januari</option>
    <option value="02">Februari</option>
    <option value="03">Mars</option>
    <option value="04">April</option>
    <option value="05">Maj</option>
    <option value="06">Juni</option>
    <option value="07">Juli</option>
    <option value="08">Augusti</option>   
    <option value="09">September</option> 
    <option value="10">Oktober</option>
    <option value="11">November</option>
    <option value="12">December</option>
</select>

<label for="day">Dag</label>
<select id="day" name="day" class="form-select" required>
    <option value="" disabled selected>Välj Dag</option>
    {%for day in range(1, 32) %}
        <option value="{{ day }}">{{ day }}</option>
    {% endfor %}
</select>



<label for="price_class">Prisklass</label>
<select id="price_class" name="price_class" class="form-select" required>
    <option value="" disabled selected>Välj elområde</option>
    <option value="SE1">SE1 - Luleå</option>
    <option value="SE2">SE2 - Sundsvall</option>
    <option value="SE3">SE3 - Stockholm</option>
    <option value="SE4">SE4 - Malmö</option>
</select>

</form>
{% endblock %}
